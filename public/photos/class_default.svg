<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c11e3d"/>
      <stop offset="1" stop-color="#6a0d1f"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <rect width="800" height="400" fill="url(#grid)"/>
  <!-- circuit traces -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4" stroke-linecap="round">
    <path d="M0 300H140L180 260H300"/>
    <path d="M800 90H660L620 130H520"/>
    <path d="M800 330H690L650 290"/>
    <path d="M0 80H90L130 120"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.3">
    <circle cx="300" cy="260" r="8"/>
    <circle cx="520" cy="130" r="8"/>
    <circle cx="650" cy="290" r="8"/>
    <circle cx="130" cy="120" r="8"/>
  </g>
  <!-- robot -->
  <g transform="translate(400 210)">
    <line x1="0" y1="-128" x2="0" y2="-98" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="-134" r="12" fill="#c9a227"/>
    <rect x="-90" y="-100" width="180" height="130" rx="34" fill="#ffffff"/>
    <rect x="-66" y="-76" width="132" height="70" rx="22" fill="#191919"/>
    <circle cx="-30" cy="-41" r="14" fill="#5eead4"/>
    <circle cx="30" cy="-41" r="14" fill="#5eead4"/>
    <rect x="-28" y="6" width="56" height="8" rx="4" fill="#c11e3d" fill-opacity="0.5"/>
    <rect x="-110" y="-60" width="20" height="50" rx="10" fill="#ffffff" fill-opacity="0.85"/>
    <rect x="90" y="-60" width="20" height="50" rx="10" fill="#ffffff" fill-opacity="0.85"/>
    <rect x="-70" y="40" width="140" height="70" rx="22" fill="#ffffff" fill-opacity="0.9"/>
    <circle cx="-40" cy="122" r="18" fill="#191919"/>
    <circle cx="40" cy="122" r="18" fill="#191919"/>
    <circle cx="-40" cy="122" r="7" fill="#c9a227"/>
    <circle cx="40" cy="122" r="7" fill="#c9a227"/>
  </g>
</svg>
